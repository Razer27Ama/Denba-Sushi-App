<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Denba Sushi: gestión local de pedidos, clientes, cobros y finanzas.">
  <title>Denba Sushi · Gestión 2.3</title>
  <style>
:root{
  color-scheme:dark;
  --bg:#09090b;--surface:#141416;--surface2:#1d1d20;--surface3:#26262a;
  --border:#2b2b30;--border-strong:#414148;--text:#f7f7f8;--muted:#a2a2aa;
  --red:#ff1724;--red-dark:#b70816;--red-soft:rgba(255,23,36,.12);
  --good:#7edbb1;--good-soft:rgba(126,219,177,.12);
  --amber:#f7c778;--amber-soft:rgba(247,199,120,.12);
  --radius:18px;--shadow:0 18px 55px rgba(0,0,0,.34);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.has-overlay{overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.43;cursor:not-allowed;box-shadow:none!important}
button,input,select,textarea{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:3px}
input,select,textarea{width:100%;background:#202024;border:1px solid var(--border-strong);border-radius:12px;color:var(--text);min-height:46px;padding:11px 13px;outline:none}
input::placeholder,textarea::placeholder{color:#85858f}
input[type=search]::-webkit-search-cancel-button{filter:grayscale(1) brightness(2)}
textarea{min-height:88px;resize:vertical}
label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:7px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(24px,3vw,31px);line-height:1.18;letter-spacing:-.7px;margin-bottom:6px}
h2{font-size:19px;line-height:1.25;letter-spacing:-.25px;margin-bottom:0}
h3{font-size:15px;margin-bottom:0}
p{margin-bottom:0}
svg{flex-shrink:0}
button svg{pointer-events:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:11px}.nowrap{white-space:nowrap}.right{text-align:right}.mono{font-variant-numeric:tabular-nums}
.eyebrow{color:var(--red);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:2px}
.flow{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.divider{height:1px;background:var(--border);margin:14px 0}
.page-shell{min-height:100vh;display:flex;max-width:1590px;margin:auto}
.sidebar{position:sticky;top:0;min-height:100vh;height:100vh;width:248px;flex-shrink:0;border-right:1px solid var(--border);padding:24px 17px;display:flex;flex-direction:column;background:#0d0d10}
.brand{display:flex;align-items:center;gap:11px;margin:0 0 33px;padding:4px 5px}
.brand img{width:57px;height:57px;object-fit:cover;border-radius:12px;border:1px solid #2e2e30}
.brand-text{font-size:15px;font-weight:850;line-height:1.3;letter-spacing:.35px}
.brand-text small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:2.1px;margin-top:2px}
.nav-group-title{font-size:10px;letter-spacing:1.7px;color:#74747d;font-weight:800;margin:17px 11px 7px}
.side-link{background:transparent;border:0;width:100%;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:650;margin-bottom:3px}
.side-link:hover,.side-link:focus-visible{background:#222226;color:var(--text)}
.side-link.active{color:#fff;background:var(--red-soft);box-shadow:inset 3px 0 var(--red)}
.side-link svg{width:19px;height:19px}
.sidebar-footer{margin-top:auto;font-size:11px;color:#787881;line-height:1.6;padding:15px 10px;border-top:1px solid var(--border)}
.main{flex:1;min-width:0;padding:30px clamp(18px,3.2vw,48px) 66px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}
.top-actions{display:flex;align-items:center;gap:11px}
.topbar-icon{background:#1c1c1f;border:1px solid var(--border);width:42px;height:42px;display:grid;place-items:center;border-radius:12px}
.topbar-icon:hover{border-color:var(--border-strong)}
.date-block{text-align:right;font-size:12px;font-weight:650;color:#cccbd0}
.date-block small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.mode-tag{font-size:10px;border:1px solid #71434a;color:#ff9ca2;border-radius:20px;padding:5px 9px;letter-spacing:.3px;font-weight:750}
@media(min-width:761px){.topbar-icon{display:none}}
.mobile-header-logo{display:none;align-items:center;gap:8px;font-weight:850;letter-spacing:1px}
.mobile-header-logo img{width:39px;height:39px;border-radius:10px;border:1px solid #333}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.page-head p{color:var(--muted);font-size:13px;margin-top:5px}
.section{margin-top:24px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:20px;min-width:0}
.card.tight{padding:15px}.card.soft{background:#161619}
.card-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.card-heading a,.link-btn{background:transparent;border:0;color:var(--red);font-size:12px;font-weight:750;display:inline-flex;align-items:center;gap:5px;padding:3px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric-label{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:650}
.metric-value{font-size:clamp(21px,2.45vw,30px);line-height:1.13;font-weight:830;letter-spacing:-1px;margin-top:13px;word-break:break-word}
.metric-foot{font-size:11px;color:#898992;margin-top:8px}
.metric-icon{color:#e2e2e5;background:var(--surface3);padding:7px;border-radius:9px;width:32px;height:32px;display:grid;place-items:center}
.metric-icon svg{width:16px;height:16px}
.btn{border-radius:12px;min-height:44px;padding:10px 15px;border:1px solid var(--border-strong);background:var(--surface3);color:var(--text);font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:9px;line-height:1.3;text-decoration:none;transition:background .15s ease,border-color .15s ease}
.btn:hover{background:#35353a}.btn.red{background:var(--red);border-color:var(--red);color:white}.btn.red:hover{background:#e51421}
.btn.ghost{background:transparent;border-color:var(--border)}.btn.ghost:hover{background:var(--surface3)}
.btn.danger{color:#ff989f;border-color:#624047;background:#271b20}
.btn.sm{min-height:36px;padding:8px 11px;font-size:12px;border-radius:10px}
.btn.square{width:44px;padding:0}.btn.sm.square{width:36px}
.btn.full{width:100%}
.btn svg{width:17px;height:17px}
.notice{font-size:12px;background:#221a1d;border:1px solid #543039;color:#f5c2c5;border-radius:13px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.notice.neutral{background:#1b1b1f;border-color:var(--border-strong);color:#bcbcc2}
.notice svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.pill{font-size:11px;font-weight:750;border-radius:999px;padding:6px 9px;background:#29292e;color:#cccbd1;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.warning{background:var(--amber-soft);color:var(--amber)}.pill.success{background:var(--good-soft);color:var(--good)}
.pill.danger{background:var(--red-soft);color:#ff989f}.pill.neutral{background:#29292e;color:#bcbcc5}
.pill svg{width:13px;height:13px}
.hero{background:linear-gradient(125deg,#2a0b10,#1b1216 54%,#141417);border:1px solid #4a252b;border-radius:22px;padding:25px 27px;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;inset:-90px -65px auto auto;width:260px;height:260px;border-radius:50%;border:45px solid rgba(255,23,36,.045);pointer-events:none}
.hero h2{font-size:24px;line-height:1.2;margin:7px 0}.hero p{font-size:12px;color:#c7aaaf;max-width:360px}
.hero .btn{position:relative;z-index:1;flex-shrink:0}
.important-number{font-weight:850;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.chart-box{width:100%;overflow:hidden;min-height:202px}
.chart-box svg{display:block;width:100%;height:auto;max-height:230px}
.chart-labels{display:flex;justify-content:space-between;font-size:10px;color:#8b8b94;margin-top:5px;padding:0 5px}
.chart-legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:35px 12px;color:var(--muted)}
.empty-state svg{width:28px;height:28px;color:#696971}.empty-state b{font-size:14px;color:#d5d5da}
.feed-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.feed-row:last-child{border-bottom:0;padding-bottom:2px}
.feed-row strong{font-size:13px}.feed-row p{font-size:11px;color:var(--muted);margin-top:4px}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.filter{border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--muted);font-weight:750;border-radius:999px;padding:9px 14px;white-space:nowrap}
.filter.active{background:var(--red-soft);color:#ffb9bd;border-color:#713039}
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:13px}
.order-card{border:1px solid var(--border);background:var(--surface);border-radius:18px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.order-card-top{padding:17px 18px 0}.order-meta{font-size:11px;color:var(--muted);margin-top:5px}
.order-products{padding:13px 18px;color:#dedee1;font-size:12px;line-height:1.75;flex:1}
.order-card-bottom{border-top:1px solid var(--border);padding:13px 18px;background:#18181b;display:flex;flex-direction:column;gap:11px}
.status-action{width:100%;border:1px solid #6b2931;color:#ffb3b8;background:#32171d;display:flex;justify-content:space-between;align-items:center;gap:6px;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;text-align:left}
.status-action:hover:not(:disabled){background:#431a21}
.status-action:disabled{opacity:1;background:#252528;border-color:var(--border);color:#b4b4bb}
.status-action svg{width:17px;height:17px}
.timer{font-size:13px;font-weight:850;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.overdue{color:#ff878f}
.order-tools{display:flex;gap:7px;flex-wrap:wrap}.order-tools .btn{flex:1}
.order-status-note{font-size:11px;color:var(--muted);margin-bottom:7px}
.list-record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-record:last-child{border-bottom:0}
.list-record .sub{font-size:11px;color:var(--muted);margin-top:4px}
.data-list{display:flex;flex-direction:column}
.catalog-desc{color:var(--muted);font-size:11px;margin-top:4px;max-width:500px}
.two-column{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.money-positive{color:var(--good)}.money-negative{color:#ff9aa1}
.bar-track{height:8px;border-radius:100px;background:#2c2c30;overflow:hidden;flex:1;min-width:0}
.bar-fill{height:100%;background:var(--red);border-radius:inherit;min-width:0}
.bar-line{display:flex;align-items:center;gap:12px;margin:15px 0}
.bar-line .bar-name{width:110px;min-width:0;color:#c8c8cc;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px}
.bar-line .bar-value{font-size:12px;font-weight:800;width:44px;text-align:right;font-variant-numeric:tabular-nums}
/* Dialogs and drawers */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.73);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.dialog{width:min(670px,100%);max-height:min(94vh,950px);overflow-y:auto;overscroll-behavior:contain;background:#151518;border:1px solid #414148;border-radius:22px;box-shadow:var(--shadow)}
.dialog.wide-dialog{width:min(770px,100%)}
.dialog-header{position:sticky;top:0;background:#19191c;z-index:3;border-bottom:1px solid var(--border);padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.dialog-content{padding:20px}
.dialog-header h2{font-size:19px}.dialog-header p{font-size:11px;color:var(--muted);margin-top:4px}
.dialog-footer{position:sticky;bottom:0;background:#19191c;border-top:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:3}
.dialog-footer strong{display:block;font-size:23px;letter-spacing:-.7px}
.dialog-footer span{font-size:11px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{min-width:0}.field.wide{grid-column:1/-1}
.field-help{font-size:11px;color:var(--muted);margin-top:6px}
.choice-group{display:flex;gap:9px}
.choice{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:#202024;border-radius:13px;padding:14px;cursor:pointer;transition:background .16s,border-color .16s}
.choice:has(input:checked){background:#2c151a;border-color:#a5303a}
.choice input{width:18px;height:18px;min-height:0;accent-color:var(--red);margin:0}
.choice b{color:#f3f3f5;display:block;font-size:13px}.choice small{color:var(--muted);font-size:10px}
.selected-customer{display:flex;align-items:center;justify-content:space-between;gap:9px;background:#19251f;border:1px solid #345141;padding:12px;border-radius:12px}
.customer-results{background:#202024;border:1px solid var(--border-strong);border-radius:12px;margin-top:7px;overflow:hidden;max-height:240px;overflow-y:auto}
.customer-results button{background:transparent;border:0;border-bottom:1px solid var(--border);width:100%;text-align:left;padding:11px 13px}
.customer-results button:last-child{border-bottom:0}.customer-results button:hover{background:#303036}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}
.qty-row:last-child{border-bottom:0}
.qty-name{font-weight:750;line-height:1.25}.qty-sub{font-size:11px;color:var(--muted);margin-top:5px}
.qty-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
.qty-actions b{display:inline-block;min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.qty-actions .btn{width:39px;height:39px;min-height:39px;padding:0;font-size:21px}
.order-summary{background:#1e1e22;border:1px solid var(--border);padding:14px 16px;border-radius:14px;margin-top:15px}
.summary-line{display:flex;align-items:center;justify-content:space-between;margin:7px 0;gap:10px}
.summary-line.total{border-top:1px solid #3c3c42;padding-top:12px;margin-top:12px;font-weight:850;font-size:17px}
.drawer-overlay{position:fixed;inset:0;z-index:55;background:#000b;display:flex;justify-content:flex-start;backdrop-filter:blur(3px)}
.drawer{height:100%;width:min(345px,87vw);overflow-y:auto;background:#161619;border-right:1px solid var(--border-strong);box-shadow:var(--shadow);padding:20px}
.drawer .side-link{margin:4px 0;width:100%}.drawer .brand{margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);border:1px solid #56565b;background:#28282e;color:#fff;min-width:210px;max-width:min(95vw,400px);border-radius:13px;padding:12px 17px;box-shadow:var(--shadow);text-align:center;font-size:12px;font-weight:700;z-index:90;pointer-events:none}
.bottom-nav{display:none}
.app-footer{color:#777780;font-size:10px;margin-top:35px}
@media(max-width:1100px){.sidebar{width:205px;padding:20px 12px}.main{padding:26px 19px 48px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-column{grid-template-columns:1fr}}
@media(max-width:760px){
  .sidebar{display:none}.main{padding:0 15px calc(110px + env(safe-area-inset-bottom));width:100%}
  .topbar{margin:0 -15px 21px;padding:11px 16px;background:#101013;border-bottom:1px solid var(--border);min-height:69px;position:sticky;top:0;z-index:15}
  .mobile-header-logo{display:flex}.topbar .eyebrow{display:none}.topbar .date-block{font-size:11px}.topbar .date-block small{font-size:10px}
  .topbar-icon{width:39px;height:39px}
  .page-head{align-items:flex-start}.page-head .btn{display:none}
  h1{font-size:26px}.page-head p{font-size:12px}
  .hero{padding:20px;align-items:flex-start;flex-direction:column;gap:15px}.hero h2{font-size:22px}.hero .btn{width:100%}
  .card{padding:16px}.grid{gap:10px}.metric-value{font-size:23px}.metric-foot{font-size:10px}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(19,19,22,.98);border-top:1px solid var(--border-strong);display:flex;justify-content:space-around;align-items:flex-start;padding:7px 8px calc(8px + env(safe-area-inset-bottom));min-height:76px;box-shadow:0 -8px 22px #0007}
  .bottom-link{background:transparent;border:0;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#92929c;padding:6px 2px;font-size:10px;font-weight:750}
  .bottom-link svg{width:22px;height:22px}.bottom-link.active{color:#fff}
  .bottom-create{background:var(--red);border:1px solid #ff3d48;color:#fff;display:grid;place-items:center;width:53px;height:53px;min-width:53px;transform:translateY(-19px);border-radius:18px;box-shadow:0 7px 20px #aa081444}
  .bottom-create svg{width:27px;height:27px}
  .overlay{padding:0;align-items:stretch;backdrop-filter:none}.dialog{max-height:100dvh;height:100dvh;max-width:none;width:100%;border:0;border-radius:0}
  .dialog-header{padding:14px 16px}.dialog-content{padding:17px 16px 22px}.dialog-footer{padding:13px 16px calc(15px + env(safe-area-inset-bottom))}
  .dialog-footer strong{font-size:21px}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
  .orders-grid{grid-template-columns:1fr}
}
@media(max-width:410px){.grid{gap:8px}.metric-value{font-size:20px}.metric-label{font-size:11px}.card{padding:14px}.form-grid{grid-template-columns:1fr}.choice{padding:11px}.dialog-content{padding:14px}.page-head h1{font-size:23px}.order-card-top{padding:15px 15px 0}.order-products{padding:12px 15px}.order-card-bottom{padding:13px 15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

  @media(max-width:760px){.page-head{flex-wrap:wrap}.page-head .btn{display:inline-flex;width:100%}}
  .list-record .row .btn{flex-shrink:0}
  @media(max-width:410px){.list-record{gap:8px}.list-record>.right>.row{gap:5px}.list-record>.right .btn{padding:7px;font-size:11px}}

  /* Recetas (v1.7): editor pensado para entrada rápida desde el móvil. */
  .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}
  .recipe-card{display:flex;flex-direction:column;gap:14px;min-width:0}
  .recipe-card .recipe-preview{flex:1;min-height:82px;border-top:1px solid var(--border);padding-top:11px}
  .recipe-preview-line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px}
  .recipe-preview-line span{color:#c5c5ca;overflow-wrap:anywhere;min-width:0}
  .recipe-preview-line b{white-space:nowrap;font-variant-numeric:tabular-nums}
  .recipe-line{display:flex;align-items:end;gap:9px;padding:12px;background:#222226;border:1px solid var(--border);border-radius:13px}
  .recipe-line .field{flex:1;min-width:0}.recipe-quantity{flex:0 0 132px!important}
  .recipe-line input,.recipe-line select{min-width:0}.recipe-line .recipe-remove{flex:0 0 42px;width:42px;height:44px;padding:0;display:grid;place-items:center;margin-bottom:1px}
  .recipe-empty{text-align:center;background:#202024;border:1px dashed #44444a;border-radius:14px;padding:24px 12px;color:var(--muted);display:flex;align-items:center;flex-direction:column;gap:5px}
  .recipe-empty p{font-weight:750;color:#f4f4f5}.recipe-empty span{font-size:12px}
  .recipe-creator{padding:17px;background:#211b1d;border:1px solid #67343d;border-radius:14px;display:flex;flex-direction:column;gap:11px}
  .recipe-creator .btnrow{display:flex;gap:9px;flex-wrap:wrap}
  @media(max-width:440px){.recipe-line{flex-wrap:wrap}.recipe-line .field:first-child{flex:1 1 100%}.recipe-line .recipe-quantity{flex:1 1 130px!important}}

  .customer-record{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
  .customer-record>.grow{grid-column:1;grid-row:1;min-width:0;overflow-wrap:anywhere}
  .customer-record>.right{grid-column:2;grid-row:1;align-self:start;min-width:98px}
  .customer-record>.loyalty-actions{grid-column:1/-1;grid-row:2}
  .loyalty-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .loyalty-summary{background:linear-gradient(145deg,#211617,#161619);border-color:#573037}
  .loyalty-score{font-size:37px;font-weight:800;letter-spacing:-1px;line-height:1.25;margin:7px 0}
  .loyalty-score span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
  .loyalty-history .list-record{gap:12px}
  .movement-points{white-space:nowrap;font-size:15px}
  .movement-points.positive{color:#79d6a5}
  .movement-points.negative{color:#ff8b92}
  .movement-points.reserved{color:#e4c16e;font-size:12px}
  @media(max-width:600px){.loyalty-actions{width:auto;justify-content:flex-start}.loyalty-history .list-record{align-items:flex-start}.loyalty-history .movement-points{font-size:12px}}

/* 1.9 · Registro de caja */
.cash-hero{background:linear-gradient(150deg,#23191b,#151519 54%);border:1px solid #663239}
.coin-layout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}
.coin-layout span{font-size:12px;background:#282427;padding:10px 11px;border:1px solid #423539;border-radius:11px;text-align:center}
.cash-check{display:flex;align-items:center;gap:12px;color:var(--text);padding:12px;background:#202024;border-radius:12px;margin:0}
.cash-check input{width:18px;height:18px;min-height:0;accent-color:#ff1724;flex:none}
@media(max-width:520px){.coin-layout{grid-template-columns:1fr}.cash-hero .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.delivery-info{border:1px solid #35353a;border-radius:12px;padding:11px 13px;margin-top:12px;overflow-wrap:anywhere;background:#1c1c20;font-size:12px;line-height:1.65}
.delivery-panel{background:#202025;border:1px solid #414149;border-radius:16px;padding:15px}
.delivery-panel textarea{min-height:76px}
.backup-notice{border:1px solid #a95530;background:#2b211e;color:#f5e2d7}
@media(max-width:480px){.delivery-panel{padding:12px}.order-tools .btn{min-height:38px}}
</style>

  // Gráficas SVG autocontenidas: funcionan sin conexión y sin librerías.
  function lineChart(series, labels, opts={}){
    if(series.every(s=>s.values.every(v=>amount(v)===0)))return `<div style="min-height:178px">${empty('chart','Aún sin datos para graficar','Las gráficas se actualizarán al registrar cobros o gastos.')}</div>`;
    const w=640,h=210,padL=43,padR=13,top=18,bottom=36,chartW=w-padL-padR,chartH=h-top-bottom;
    const all=series.flatMap(s=>s.values.map(v=>amount(v)));
    const max=Math.max(1,...all),min=Math.min(0,...all);
    const magnitude=Math.max(Math.abs(min),max),unit=Math.pow(10,Math.floor(Math.log10(magnitude)));
    const ymax=Math.ceil(max/unit)*unit,ymin=Math.floor(min/unit)*unit;
    const X=i=>padL+(labels.length===1?chartW/2:i*chartW/(labels.length-1));
    const Y=v=>top+chartH-((amount(v)-ymin)/(ymax-ymin))*chartH;
    const grid=[ymin,0,ymax].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<line x1="${padL}" y1="${Y(v)}" x2="${w-padR}" y2="${Y(v)}" stroke="#35353b" stroke-dasharray="3 5"/><text x="${padL-8}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#8e8e96">${Math.abs(v)>=1000?(v/1000).toFixed(1).replace('.0','')+'k':Math.round(v)}</text>`).join('');
    const lines=series.map((s,i)=>{
      const points=s.values.map((v,j)=>`${X(j).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
      const circles=s.values.map((v,j)=>`<circle cx="${X(j)}" cy="${Y(v)}" r="3.5" fill="${s.color}" stroke="#151518" stroke-width="2"><title>${esc(labels[j])}: ${money(v)}</title></circle>`).join('');
      const fill=i===0&&opts.area?`<polygon points="${X(0)},${Y(0)} ${points} ${X(labels.length-1)},${Y(0)}" fill="${s.color}" opacity=".08"/>`:'';
      return `${fill}<polyline fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}"/>${circles}`;
    }).join('');
    const axis=labels.map((l,i)=>`<text x="${X(i)}" y="${h-9}" text-anchor="middle" font-size="10" fill="#a1a1a8">${esc(l)}</text>`).join('');
    return `<div class="chart-box"><svg role="img" aria-label="${esc(series.map(s=>s.name+': '+s.values.map(v=>money(v)).join(', ')).join('. '))}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${lines}${axis}</svg></div><div class="chart-legend">${series.map(s=>`<span><i class="legend-dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  }

  // Recetas: cantidades de ingredientes para UNA unidad del producto.
  // No generan salidas de inventario ni se usan para costear automáticamente.
  function recipeFor(productId){return db.recipes.find(r=>r.productId===productId)}
  function recipeCost(productId,source=db){
    const r=source.recipes.find(r=>r.productId===productId);
    if(!r||!r.ingredients.length)return null;
    if(r.ingredients.some(l=>!source.inventory.some(i=>i.id===l.ingredientId)))return null;
    return roundMoney(sum(r.ingredients,l=>{
      const i=source.inventory.find(i=>i.id===l.ingredientId);
      return amount(i.costPerUnit)*amount(l.quantity);
    }));
  }
  function stockRequirements(items,source=db){
    const needs=new Map(),products=[];
    for(const item of items){
      const r=source.recipes.find(r=>r.productId===item.productId);
      if(!r||!r.autoDeduct)continue;
      if(!r.ingredients.length)throw Error('La receta automática está vacía: '+(item.name||item.productId));
      products.push(item);
      for(const line of r.ingredients){
        if(!source.inventory.some(i=>i.id===line.ingredientId))throw Error('Falta un insumo de '+(item.name||'receta'));
        needs.set(line.ingredientId,roundQty((needs.get(line.ingredientId)||0)+line.quantity*item.quantity));
      }
    }
    return {needs,products};
  }
  function consumeRecipes(items,source,reference,reason){
    if(source.stockMovements.some(m=>m.autoReference===reference))throw Error('Este consumo de inventario ya fue registrado');
    const {needs,products}=stockRequirements(items,source);
    for(const [id,q] of needs){
      const i=source.inventory.find(i=>i.id===id);
      if(ingredientStock(id,source)+0.000001<q)throw Error('Existencia insuficiente: '+i.name+' (faltan '+roundQty(q-ingredientStock(id,source))+' '+inventoryUnitLabel(i.unit)+')');
    }
    for(const [id,q] of needs){source.stockMovements.push({id:uuid(),ingredientId:id,delta:roundQty(-q),createdAt:now(),reason,autoReference:reference})}
    return products.length;
  }
  function recipeStatus(p){

  function saveRecipe(){
    const d=state.recipeDraft;if(!d)return;

    const seen=new Set(),lines=[];

      const ing=db.inventory.find(i=>i.id===l.ingredientId),q=Number(l.quantity);
      if(!ing){toast('Selecciona un insumo válido en todas las filas');return}
      if(seen.has(ing.id)){toast('El insumo «'+ing.name+'» está repetido');return}
      if(!l.quantity||!Number.isFinite(q)||q<=0||q>1e8||roundQty(q)!==q||(ing.unit==='pza'&&!Number.isInteger(q))){toast('Revisa la cantidad de «'+ing.name+'» en '+inventoryUnitLabel(ing.unit));return}
      seen.add(ing.id);lines.push({ingredientId:ing.id,quantity:roundQty(q)});

  // Registro de cobros independiente de los pedidos: evita eliminar ventas de días pasados al devolverlas.
  const paymentLabel=m=>m==='efectivo'?'Efectivo':m==='transferencia'?'Transferencia':'Sin clasificar';
  const activeSession=()=>db.cashSessions.find(s=>!s.closedAt)||null;
  const todaySession=()=>db.cashSessions.find(s=>s.date===today())||null;
  const canTransact=()=>{const s=activeSession();return !!(s&&s.date===today()&&!s.closedAt)};
  const cashSource=(source=db)=>source.paymentTransactions||[];
  function sessionTotals(session,source=db){
    const transactions=cashSource(source).filter(t=>t.sessionId===session.id);
    const cashSales=roundMoney(sum(transactions.filter(t=>t.type==='cobro'&&t.method==='efectivo'),t=>t.amount));
    const transfers=roundMoney(sum(transactions.filter(t=>t.type==='cobro'&&t.method==='transferencia'),t=>t.amount));
    const cashRefunds=roundMoney(sum(transactions.filter(t=>t.type==='devolucion'&&t.method==='efectivo'),t=>t.amount));

    const transferExpenses=roundMoney(sum(source.expenses.filter(e=>e.cashSessionId===session.id&&e.paymentMethod==='transferencia'&&!e.voidedAt),e=>e.amount));
    return {cashSales,transfers,cashRefunds,transferRefunds,cashExpenses,transferExpenses,expected:roundMoney(session.openingFund+cashSales-cashRefunds-cashExpenses),netSales:roundMoney(cashSales+transfers-cashRefunds-transferRefunds)};
  }
  function methodBreakdown(day,method){return roundMoney(sum(db.paymentTransactions.filter(t=>localDay(t.createdAt)===day&&t.method===method),signedTransaction))}

  function saveStandaloneRedemption(form){
    const customerId=form.dataset.customerId||'',code=String(new FormData(form).get('code')||''),productId=String(new FormData(form).get('productId')||''),note=String(new FormData(form).get('note')||'').trim();
    const spec=rewardSpec(code),c=db.customers.find(c=>c.id===customerId),p=standaloneRewardProducts(code).find(p=>p.id===productId);
    if(!c||!spec||!p){toast('Selecciona una recompensa y un producto válido');return}
    if(loyaltyBalance(customerId).available<spec.cost){toast('Puntos insuficientes; revisa los movimientos del cliente');return}
    if(!confirm(`¿Confirmas que se entregará ${p.name} a ${customerFullName(c)} y se descontarán ${spec.cost} puntos?`))return;
    const ok=update(copy=>{
      const customer=copy.customers.find(c=>c.id===customerId);
      if(!customer||!copy.products.some(x=>x.id===productId&&x.active!==false))throw Error('Producto o cliente ya no disponible');
      const wallet=loyaltyBalance(customerId,'',copy);
      if(wallet.available<spec.cost)throw Error('Puntos insuficientes para este canje');
      const redemptionId=uuid();
      consumeRecipes([{productId,quantity:1,name:p.name}],copy,'canje:'+redemptionId,'Consumo automático · recompensa '+p.name);
      copy.loyaltyRedemptions.push({id:redemptionId,customerId,code:spec.code,cost:spec.cost,productId,productName:p.name,referencePrice:roundMoney(p.price),quantity:1,createdAt:now(),note});
    });
    if(ok){closeModal();openLoyaltyHistory(customerId);toast('Canje registrado: −'+spec.cost+' puntos')}
  }

  // El pedido se edita en memoria; solo se guarda completo al confirmar.
  function snapshotPrice(i){
    if(Number.isFinite(Number(i.unitPrice))&&i.unitPrice!==null&&i.unitPrice!==undefined)return Number(i.unitPrice);
    if(Number.isFinite(Number(i.subtotal))&&amount(i.quantity)>0)return roundMoney(Number(i.subtotal)/Number(i.quantity));
    return amount(db.products.find(p=>p.id===i.productId)?.price);
  }
  function getDraftLine(id){return state.orderDraft.items.find(i=>i.productId===id)}
  function draftQuantity(id){return state.orderDraft.items.filter(i=>i.productId===id).reduce((n,i)=>n+amount(i.quantity),0)}
  function draftSubtotal(){return roundMoney(sum(state.orderDraft.items,i=>i.quantity*i.unitPrice))}
  function draftReward(){return discountedReward(state.orderDraft?.items,state.orderDraft?.reward)}
  function draftDiscount(){return draftReward()?.discount||0}
  function draftTotal(){return roundMoney(Math.max(0,draftSubtotal()-draftDiscount())+(state.orderDraft.fulfillment==='delivery'?DELIVERY_FEE:0))}
  function draftLocked(){return !!state.orderDraft.order && (paid(state.orderDraft.order)||state.orderDraft.order.status==='cancelado')}
  function orderLines(){
    const d=state.orderDraft;
    const products=db.products.filter(p=>p.active!==false||d.items.some(i=>i.productId===p.id)).map(p=>({...p}));
    for(const i of d.items){if(!products.some(p=>p.id===i.productId))products.push({id:i.productId,name:i.name||'Producto histórico',category:'Productos históricos',price:i.unitPrice,archived:true})}
    const categories=[...new Set(products.map(p=>p.category||'Otros'))];
    return categories.map(category=>`<div class="section"><div class="row between"><h3>${esc(category)}</h3><span class="muted small">Unidades</span></div><div style="margin-top:7px">${products.filter(p=>(p.category||'Otros')===category).map(p=>{
      const line=getDraftLine(p.id),q=draftQuantity(p.id),price=line?line.unitPrice:amount(p.price);
      return `<div class="qty-row"><div class="grow"><div class="qty-name">${esc(p.name)}</div><div class="qty-sub">${money(price)}${p.active===false||p.archived?' · No disponible':''}</div></div><div class="qty-actions"><button class="btn ghost" type="button" data-action="quantity" data-id="${esc(p.id)}" data-delta="-1" aria-label="Restar ${esc(p.name)}" ${q===0||draftLocked()||p.archived?'disabled':''}>${icon('minus',19)}</button><b data-qty="${esc(p.id)}">${q}</b><button class="btn ${q?'ghost':'red'}" type="button" data-action="quantity" data-id="${esc(p.id)}" data-delta="1" aria-label="Sumar ${esc(p.name)}" ${q>=999||draftLocked()||p.archived?'disabled':''}>${icon('plus',19)}</button></div></div>`;
    }).join('')}</div></div>`).join('');
  }

  function selectReward(code){

    d.reward={code,productId:lines[0].productId};refreshRewardArea();
  }

  function updateDraftDisplay(){
    if(!state.orderDraft)return;
    const d=state.orderDraft,subtotal=draftSubtotal(),count=sum(d.items,i=>i.quantity),fee=d.fulfillment==='delivery'?DELIVERY_FEE:0;
    if($('itemCount'))$('itemCount').textContent=`${count} ${count===1?'pieza':'piezas'}`;
    if($('subtotalText'))$('subtotalText').textContent=money(subtotal);
    if($('feeText'))$('feeText').textContent=money(fee);
    if($('discountText'))$('discountText').textContent='−'+money(draftDiscount());
    if($('totalText'))$('totalText').textContent=money(draftTotal());
    if($('stickyTotal'))$('stickyTotal').textContent=money(draftTotal());
    for(const q of document.querySelectorAll('[data-qty]')){
      const n=draftQuantity(q.dataset.qty);q.textContent=n;
      const minus=q.parentElement.querySelector('[data-delta="-1"]'),plus=q.parentElement.querySelector('[data-delta="1"]');
      const archived=!db.products.some(p=>p.id===q.dataset.qty);
      if(minus)minus.disabled=n===0||draftLocked()||archived;
      if(plus){plus.disabled=n>=999||draftLocked()||archived;plus.classList.toggle('red',!n);plus.classList.toggle('ghost',!!n)}
    }
  }
  function changeQuantity(id,delta){
    const p=db.products.find(p=>p.id===id);if(!p||!state.orderDraft||draftLocked())return;
    let l=getDraftLine(id),q=draftQuantity(id);
    if(delta>0&&q>=999)return;
    if(delta<0&&q<=0)return;
    if(!l&&delta>0){l={productId:id,name:p.name,quantity:0,unitPrice:amount(p.price)};state.orderDraft.items.push(l)}
    if(!l)return;
    l.quantity=Number(l.quantity)+delta;
    state.orderDraft.items=state.orderDraft.items.filter(i=>i.quantity>0);
    refreshRewardArea();
  }

  function saveOrder(){
    const d=state.orderDraft;if(!d)return;
    if(!d.items.length){toast('Selecciona al menos un producto');return}
    const count=sum(d.items,i=>i.quantity);
    if(count<=0||d.items.some(i=>!Number.isInteger(i.quantity)||i.quantity<1||i.quantity>999)){toast('Revisa las cantidades');return}
    if(d.order && draftLocked()){
      const prior=d.order;
      if(d.fulfillment!==(delivery(prior)?'delivery':'pickup') || JSON.stringify(d.items.map(i=>[i.productId,i.quantity,i.unitPrice]))!==JSON.stringify(prior.items.map(i=>[i.productId,i.quantity,snapshotPrice(i)]))){toast('Un pedido cobrado o cancelado no permite modificar importes');return}
    }
    if(d.customerMode==='new'){
      d.customerName=($('newCustomerName')?.value||'').trim();d.customerLastName=($('newCustomerLastName')?.value||'').trim();d.customerAddress=($('newCustomerAddress')?.value||'').trim();d.customerPhone=($('newCustomerPhone')?.value||'').trim();
      if(!d.customerName||!d.customerLastName){toast('Completa nombre y apellido');(!d.customerName?$('newCustomerName'):$('newCustomerLastName'))?.focus();return}
    }
    if(d.fulfillment==='delivery'){
      d.deliveryAddress=($('deliveryAddress')?.value||d.deliveryAddress||'').trim();
      d.deliveryReference=($('deliveryReference')?.value||d.deliveryReference||'').trim();
      if(!d.deliveryAddress){toast('Escribe la dirección de entrega');$('deliveryAddress')?.focus();return}
    }
    const productsTotal=draftSubtotal(),fee=d.fulfillment==='delivery'?DELIVERY_FEE:0,applied=draftReward(),discount=applied?.discount||0,total=roundMoney(productsTotal-discount+fee),notes=($('orderNotes')?.value||'').trim();
    if(d.reward&&!applied){toast('La recompensa ya no es válida para estos productos');return}
    if(applied&&d.customerMode!=='selected'){toast('Para canjear puntos vincula un cliente existente');return}
    if(applied&&!draftLocked()&&loyaltyBalance(d.customerSelected,d.order?.id||'').available<applied.cost){toast('Puntos insuficientes para esta recompensa');return}
    if(d.order&&paid(d.order)&&((d.order.customerId||'')!==(d.customerMode==='selected'?d.customerSelected:''))){toast('Un pedido cobrado no permite cambiar de cliente');return}
    if(d.order&&draftLocked()&&JSON.stringify(d.order.reward||null)!==JSON.stringify(applied||null)){
      // La estructura nueva puede tener campos descriptivos adicionales; comparar lo que afecta el monto y puntos.
      if((d.order.reward?.code||'')!==(applied?.code||'')||(d.order.reward?.productId||'')!==(applied?.productId||'')){toast('Un canje cobrado o cancelado no puede modificarse');return}
    }
    const baseId=d.order?.id||'';
    let linkedExisting=false;
    const okay=update(copy=>{
      let customerId='',customerName='';
      if(d.customerMode==='selected'){
        const c=copy.customers.find(c=>c.id===d.customerSelected);if(!c)throw Error('Cliente inexistente');
        customerId=c.id;customerName=c.name;
      }else if(d.customerMode==='new'){
        const c=d.customerPhone?copy.customers.find(x=>x.phone&&x.phone.trim()===d.customerPhone):null;
        if(c){customerId=c.id;customerName=c.name;linkedExisting=true}
        else {customerId=uuid();customerName=[d.customerName,d.customerLastName].join(' ');copy.customers.push({id:customerId,name:customerName,firstName:d.customerName,lastName:d.customerLastName,address:d.customerAddress,phone:d.customerPhone})}
      }else if(d.order?.customerName&&!d.order.customerId){customerName=d.order.customerName}
      const items=d.items.map(i=>({productId:i.productId,name:i.name||copy.products.find(p=>p.id===i.productId)?.name||'Producto',quantity:i.quantity,unitPrice:i.unitPrice,subtotal:roundMoney(i.quantity*i.unitPrice)}));
      if(applied&&!draftLocked()){
        const balance=loyaltyBalance(customerId,baseId,copy);
        if(balance.available<applied.cost)throw Error('Puntos insuficientes para reservar el canje');
      }
      const fields={customerId,customerName,notes,fulfillment:d.fulfillment,deliveryFee:fee,deliveryAddress:d.fulfillment==='delivery'?d.deliveryAddress:'',deliveryReference:d.fulfillment==='delivery'?d.deliveryReference:'',items,total,reward:applied,discount};
      if(baseId){const o=copy.orders.find(o=>o.id===baseId);if(!o)throw Error('Pedido inexistente');Object.assign(o,fields)}
      else{const number=String(Math.max(0,...copy.orders.map(o=>parseInt(o.number,10)||0))+1).padStart(4,'0');copy.orders.push({id:uuid(),number,createdAt:now(),paidAt:null,channel:'No especificado',status:'pendiente',paymentStatus:'pendiente',prepStartedAt:null,dispatchedAt:null,deliveredAt:null,...fields})}
    });
    if(okay){closeModal();toast(linkedExisting?'Pedido guardado; cliente existente vinculado':'Pedido guardado correctamente')}
  }

        if(delivery(o)&&o.deliveryReference){wrap('Referencia: '+o.deliveryReference);y+=4}
        y+=10;line();
        text('DETALLE',pad,y,26,true);y+=46;
        for(const i of o.items){
          wrap(`${i.quantity} × ${i.name||'Producto'}`,full-155,25,true);
          text(money(i.subtotal??i.quantity*amount(i.unitPrice)),W-pad,y-34,24,true,'#151515','right');

        }

        if(delivery(o))itemRow('Envío',money(o.deliveryFee));
        ctx.fillStyle='#f3f3f3';ctx.fillRect(pad-10,y-5,full+20,70);
        text('TOTAL',pad,y+10,30,true);text(money(o.total),W-pad,y+10,32,true,'#151515','right');y+=89;

        y+=34;line();
        text('¡GRACIAS POR TU COMPRA!',W/2,y,26,true,'#171717','center');y+=43;
        text('Denba Sushi · Elaborado para tu pedido',W/2,y,19,false,'#777','center');y+=66;
        const height=Math.min(draft.height,Math.ceil(y+35));
        const final=document.createElement('canvas');final.width=W;final.height=height;
        const fctx=final.getContext('2d');fctx.fillStyle='#fff';fctx.fillRect(0,0,W,height);fctx.drawImage(draft,0,0,W,height,0,0,W,height);
        final.toBlob(blob=>{

        },'image/jpeg',.93);

    try{
      const incoming=JSON.parse(await file.text());if(!validData(incoming))throw Error('El archivo no tiene el formato de Denba Sushi compatible (v1).');

      if(!confirm(`Este respaldo contiene ${incomingCount} pedidos. Importarlo reemplazará TODOS los datos guardados actualmente en este navegador. ¿Continuar?`))return;
      migrate(incoming);
      if(persist(incoming)){loadError=null;state.page='inicio';closeModal();closeDrawer();render();toast('Respaldo importado con éxito')}

      case 'quantity':changeQuantity(id,Number(target.dataset.delta)||0);break;
      case 'customer-pick':chooseCustomer(id);break;
      case 'customer-new-inline':newCustomerInline();break;
      case 'customer-unlink':unlinkCustomer();break;
      case 'product-new':openProduct();break;
      case 'product-edit':openProduct(id);break;
      case 'customer-new':openCustomer();break;
      case 'customer-edit':openCustomer(id);break;
      case 'loyalty-history':openLoyaltyHistory(id);break;
      case 'loyalty-redeem':openStandaloneRedemption(id);break;
      case 'expense-new':openExpense();break;
      case 'expense-delete':deleteExpense(id);break;
      case 'export':exportData();break;
      case 'import':$('importFile').click();break;
      case 'reset':resetData();break;
      case 'promote-real':promoteReal();break;
    }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='customerSearch')customerSearch(e.target.value);
    if(e.target.id==='cashCounted')showCashClosePreview();
    if(e.target.id==='cashReceived')showChargeChange();
    if(e.target.id==='newCustomerName'&&state.orderDraft)state.orderDraft.customerName=e.target.value;
    if(e.target.id==='newCustomerPhone'&&state.orderDraft)state.orderDraft.customerPhone=e.target.value;
    if(e.target.id==='newCustomerLastName'&&state.orderDraft)state.orderDraft.customerLastName=e.target.value;
    if(e.target.id==='newCustomerAddress'&&state.orderDraft)state.orderDraft.customerAddress=e.target.value;
    if(e.target.id==='deliveryAddress'&&state.orderDraft)state.orderDraft.deliveryAddress=e.target.value;
    if(e.target.id==='deliveryReference'&&state.orderDraft)state.orderDraft.deliveryReference=e.target.value;
  });
  document.addEventListener('change',e=>{
    if(e.target.matches('[data-recipe-select]')){recipeSelectChanged();return}
    if(e.target.id==='chargeMethod'){showChargeChange();return}
    if(e.target.id==='rewardCode'){selectReward(e.target.value);return}
    if(e.target.id==='standaloneRewardCode'){refreshStandaloneProducts();return}
    if(e.target.id==='rewardProductId'&&state.orderDraft?.reward){state.orderDraft.reward.productId=e.target.value;refreshRewardArea();return}
    if(e.target.matches('#orderForm input[name="fulfillment"]')){
      if(!state.orderDraft||draftLocked())return;
      state.orderDraft.fulfillment=e.target.value;syncDraftAddress();refreshDeliveryFields();updateDraftDisplay();
    }
  });
  document.addEventListener('submit',e=>{
    const forms={recipeForm:saveRecipe,orderForm:saveOrder,productForm:saveProduct,customerForm:saveCustomer,expenseForm:saveExpense,settingsForm:saveSettings,ingredientForm:saveIngredient,stockForm:saveStockMove,standaloneRedemptionForm:saveStandaloneRedemption,cashOpenForm:saveCashOpen,cashCloseForm:saveCashClose,chargeForm:saveCharge,refundForm:saveRefund,classifyForm:saveClassify};
    const handler=forms[e.target.id];if(!handler)return;
    e.preventDefault();handler(e.target);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') {if(state.modal)closeModal();else if(state.drawer)closeDrawer()}
  });
  $('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';await importData(f)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickCountdowns();if(db)$('headerDateShort').textContent=timeLabel(now())}});
  setInterval(tickCountdowns,1000);
  render();
})();

  </script>
  <script>
  // PWA installation and offline caching require HTTPS (or localhost).
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('No se pudo activar el modo sin conexión:', err));
    });
  }
  </script>
</body>
</html>
